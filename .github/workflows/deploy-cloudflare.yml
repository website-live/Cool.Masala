name: Deploy Cool Masala to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cool-masala-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_ACCESS_KEY: ${{ secrets.ADMIN_ACCESS_KEY }}
      ADMIN_TOTP_SECRET: ${{ secrets.ADMIN_TOTP_SECRET }}
      NOTIFICATION_FROM_EMAIL: ${{ secrets.NOTIFICATION_FROM_EMAIL }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Configure encrypted Worker secrets
        shell: bash
        run: |
          test -n "$ADMIN_ACCESS_KEY" || (echo "Missing GitHub secret ADMIN_ACCESS_KEY" && exit 1)
          test -n "$ADMIN_TOTP_SECRET" || (echo "Missing GitHub secret ADMIN_TOTP_SECRET" && exit 1)
          test -n "$NOTIFICATION_FROM_EMAIL" || (echo "Missing GitHub secret NOTIFICATION_FROM_EMAIL" && exit 1)
          printf '%s' "$ADMIN_ACCESS_KEY" | bunx wrangler secret put ADMIN_ACCESS_KEY --config build/server/wrangler.json
          printf '%s' "$ADMIN_TOTP_SECRET" | bunx wrangler secret put ADMIN_TOTP_SECRET --config build/server/wrangler.json
          printf '%s' "$NOTIFICATION_FROM_EMAIL" | bunx wrangler secret put NOTIFICATION_FROM_EMAIL --config build/server/wrangler.json

      - name: Deploy Worker and Durable Object
        run: bunx wrangler deploy --config build/server/wrangler.json
