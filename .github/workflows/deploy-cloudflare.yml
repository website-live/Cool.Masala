name: Deploy Cool Masala to Cloudflare

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      target_environment:
        description: Explicit environment target for a manual deployment
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: cool-masala-${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Deploy staging Worker
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/staging') || (github.event_name == 'workflow_dispatch' && inputs.target_environment == 'staging') }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_ACCESS_KEY: ${{ secrets.STAGING_ADMIN_ACCESS_KEY }}
      ADMIN_TOTP_SECRET: ${{ secrets.STAGING_ADMIN_TOTP_SECRET }}
      NOTIFICATION_FROM_EMAIL: ${{ secrets.STAGING_NOTIFICATION_FROM_EMAIL }}
      WORKER_NAME: cool-masala-staging
      TARGET_ENV: staging
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install

      - name: Build application
        run: bun run build

      - name: Normalize Cloudflare account ID
        shell: bash
        run: |
          ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          if [[ ! "$ACCOUNT_ID" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID contains invalid characters after whitespace normalization."
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Configure encrypted staging Worker secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$ADMIN_ACCESS_KEY" || (echo "Missing STAGING_ADMIN_ACCESS_KEY" && exit 1)
          test -n "$ADMIN_TOTP_SECRET" || (echo "Missing STAGING_ADMIN_TOTP_SECRET" && exit 1)
          test -n "$NOTIFICATION_FROM_EMAIL" || (echo "Missing STAGING_NOTIFICATION_FROM_EMAIL" && exit 1)
          printf '%s' "$ADMIN_ACCESS_KEY" | bunx wrangler secret put ADMIN_ACCESS_KEY --config wrangler.jsonc --env "$TARGET_ENV"
          printf '%s' "$ADMIN_TOTP_SECRET" | bunx wrangler secret put ADMIN_TOTP_SECRET --config wrangler.jsonc --env "$TARGET_ENV"
          printf '%s' "$NOTIFICATION_FROM_EMAIL" | bunx wrangler secret put NOTIFICATION_FROM_EMAIL --config wrangler.jsonc --env "$TARGET_ENV"

      - name: Deploy staging Worker and isolated Durable Object
        shell: bash
        run: |
          set -o pipefail
          # Pin both the named Wrangler environment and the Worker name so the
          # compiled manifest cannot deploy to the base app by accident.
          bunx wrangler deploy --config build/server/wrangler.json --env staging --name "$WORKER_NAME" 2>&1 | tee deploy.log

      - name: Verify staging Worker serves the new admin build
        shell: bash
        env:
          STAGING_URL: https://cool-masala-staging.luxerion-furnish.workers.dev
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            body="$(curl --fail --silent --show-error --location "$STAGING_URL/admin?deploy=$GITHUB_SHA")"
            if grep -q "A calm control room for your store" <<<"$body"; then
              echo "Staging Worker is serving the Shopify admin build for $GITHUB_SHA"
              exit 0
            fi
            echo "Staging Worker has not surfaced the new admin build yet (attempt $attempt/6)."
            sleep 5
          done
          echo "Staging Worker did not serve the expected Shopify admin copy for $GITHUB_SHA."
          exit 1

      - name: Write staging deployment summary
        if: always()
        shell: bash
        run: |
          DEPLOYMENT_ID=$(grep -Eo '(Current )?Version ID: [^[:space:]]+' deploy.log 2>/dev/null | tail -1 | sed -E 's/.*ID: //' || true)
          DEPLOYMENT_URL=$(grep -Eo 'https://[^[:space:]]+' deploy.log 2>/dev/null | tail -1 | sed 's/[),.]$//' || true)
          {
            echo "## Cool Masala staging deployment"
            echo "- Environment: **staging**"
            echo "- Worker: **$WORKER_NAME**"
            echo "- Deployment ID: ${DEPLOYMENT_ID:-not emitted by Wrangler}"
            echo "- Deployment URL: ${DEPLOYMENT_URL:-not emitted by Wrangler output}"
            echo "- Source: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy production Worker
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.target_environment == 'production') }}
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_ACCESS_KEY: ${{ secrets.PROD_ADMIN_ACCESS_KEY }}
      ADMIN_TOTP_SECRET: ${{ secrets.PROD_ADMIN_TOTP_SECRET }}
      NOTIFICATION_FROM_EMAIL: ${{ secrets.PROD_NOTIFICATION_FROM_EMAIL }}
      WORKER_NAME: cool-masala-prod
      TARGET_ENV: production
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install

      - name: Build application
        run: bun run build

      - name: Normalize Cloudflare account ID
        shell: bash
        run: |
          ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          if [[ ! "$ACCOUNT_ID" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID contains invalid characters after whitespace normalization."
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Validate production Cloudflare and admin inputs
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$ADMIN_ACCESS_KEY" || (echo "Missing PROD_ADMIN_ACCESS_KEY" && exit 1)
          test -n "$ADMIN_TOTP_SECRET" || (echo "Missing PROD_ADMIN_TOTP_SECRET" && exit 1)
          echo "Cloudflare and required admin inputs are present."

      - name: Sync production ADMIN_ACCESS_KEY
        shell: bash
        run: printf '%s' "$ADMIN_ACCESS_KEY" | bunx wrangler secret put ADMIN_ACCESS_KEY --config wrangler.jsonc --env "$TARGET_ENV"

      - name: Sync production ADMIN_TOTP_SECRET
        shell: bash
        run: printf '%s' "$ADMIN_TOTP_SECRET" | bunx wrangler secret put ADMIN_TOTP_SECRET --config wrangler.jsonc --env "$TARGET_ENV"

      - name: Sync optional production notification sender
        if: ${{ env.NOTIFICATION_FROM_EMAIL != '' }}
        shell: bash
        run: printf '%s' "$NOTIFICATION_FROM_EMAIL" | bunx wrangler secret put NOTIFICATION_FROM_EMAIL --config wrangler.jsonc --env "$TARGET_ENV"

      - name: Deploy production Worker and isolated Durable Object
        shell: bash
        run: |
          set -o pipefail
          bunx wrangler deploy --config build/server/wrangler.json --env "$TARGET_ENV" 2>&1 | tee deploy.log

      - name: Write production deployment summary
        if: always()
        shell: bash
        run: |
          DEPLOYMENT_ID=$(grep -Eo '(Current )?Version ID: [^[:space:]]+' deploy.log 2>/dev/null | tail -1 | sed -E 's/.*ID: //' || true)
          DEPLOYMENT_URL=$(grep -Eo 'https://[^[:space:]]+' deploy.log 2>/dev/null | tail -1 | sed 's/[),.]$//' || true)
          {
            echo "## Cool Masala production deployment"
            echo "- Environment: **production**"
            echo "- Worker: **$WORKER_NAME**"
            echo "- Deployment ID: ${DEPLOYMENT_ID:-not emitted by Wrangler}"
            echo "- Deployment URL: ${DEPLOYMENT_URL:-not emitted by Wrangler output}"
            echo "- Source: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
