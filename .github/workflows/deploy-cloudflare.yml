name: Deploy Cool Masala to Cloudflare

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      target_environment:
        description: Explicit environment target for a manual deployment
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: cool-masala-${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Deploy staging Worker
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/staging') || (github.event_name == 'workflow_dispatch' && inputs.target_environment == 'staging') }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_ACCESS_KEY: ${{ secrets.STAGING_ADMIN_ACCESS_KEY }}
      ADMIN_TOTP_SECRET: ${{ secrets.STAGING_ADMIN_TOTP_SECRET }}
      NOTIFICATION_FROM_EMAIL: ${{ secrets.STAGING_NOTIFICATION_FROM_EMAIL }}
      WORKER_NAME: cool-masala-staging
      TARGET_ENV: staging
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install

      - name: Build application
        run: bun run build

      - name: Configure encrypted staging Worker secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$ADMIN_ACCESS_KEY" || (echo "Missing STAGING_ADMIN_ACCESS_KEY" && exit 1)
          test -n "$ADMIN_TOTP_SECRET" || (echo "Missing STAGING_ADMIN_TOTP_SECRET" && exit 1)
          test -n "$NOTIFICATION_FROM_EMAIL" || (echo "Missing STAGING_NOTIFICATION_FROM_EMAIL" && exit 1)
          printf '%s' "$ADMIN_ACCESS_KEY" | bunx wrangler secret put ADMIN_ACCESS_KEY --name "$WORKER_NAME"
          printf '%s' "$ADMIN_TOTP_SECRET" | bunx wrangler secret put ADMIN_TOTP_SECRET --name "$WORKER_NAME"
          printf '%s' "$NOTIFICATION_FROM_EMAIL" | bunx wrangler secret put NOTIFICATION_FROM_EMAIL --name "$WORKER_NAME"

      - name: Deploy staging Worker and isolated Durable Object
        shell: bash
        run: |
          set -o pipefail
          bunx wrangler deploy --config build/server/wrangler.json --env "$TARGET_ENV" 2>&1 | tee deploy.log

      - name: Write staging deployment summary
        if: always()
        shell: bash
        run: |
          DEPLOYMENT_ID=$(grep -Eo '(Current )?Version ID: [^[:space:]]+' deploy.log 2>/dev/null | tail -1 | sed -E 's/.*ID: //' || true)
          DEPLOYMENT_URL=$(grep -Eo 'https://[^[:space:]]+' deploy.log 2>/dev/null | tail -1 | sed 's/[),.]$//' || true)
          {
            echo "## Cool Masala staging deployment"
            echo "- Environment: **staging**"
            echo "- Worker: **$WORKER_NAME**"
            echo "- Deployment ID: \\`${DEPLOYMENT_ID:-not emitted by Wrangler}\`"
            echo "- Deployment URL: ${DEPLOYMENT_URL:-not emitted by Wrangler output}"
            echo "- Source: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy production Worker
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.target_environment == 'production') }}
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_ACCESS_KEY: ${{ secrets.PROD_ADMIN_ACCESS_KEY }}
      ADMIN_TOTP_SECRET: ${{ secrets.PROD_ADMIN_TOTP_SECRET }}
      NOTIFICATION_FROM_EMAIL: ${{ secrets.PROD_NOTIFICATION_FROM_EMAIL }}
      WORKER_NAME: cool-masala-prod
      TARGET_ENV: production
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install

      - name: Build application
        run: bun run build

      - name: Validate production Cloudflare and admin inputs
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$ADMIN_ACCESS_KEY" || (echo "Missing PROD_ADMIN_ACCESS_KEY" && exit 1)
          test -n "$ADMIN_TOTP_SECRET" || (echo "Missing PROD_ADMIN_TOTP_SECRET" && exit 1)
          echo "Cloudflare and required admin inputs are present."

      - name: Sync production ADMIN_ACCESS_KEY
        shell: bash
        run: printf '%s' "$ADMIN_ACCESS_KEY" | bunx wrangler secret put ADMIN_ACCESS_KEY --name "$WORKER_NAME"

      - name: Sync production ADMIN_TOTP_SECRET
        shell: bash
        run: printf '%s' "$ADMIN_TOTP_SECRET" | bunx wrangler secret put ADMIN_TOTP_SECRET --name "$WORKER_NAME"

      - name: Sync optional production notification sender
        if: ${{ env.NOTIFICATION_FROM_EMAIL != '' }}
        shell: bash
        run: printf '%s' "$NOTIFICATION_FROM_EMAIL" | bunx wrangler secret put NOTIFICATION_FROM_EMAIL --name "$WORKER_NAME"

      - name: Deploy production Worker and isolated Durable Object
        shell: bash
        run: |
          set -o pipefail
          bunx wrangler deploy --config build/server/wrangler.json --env "$TARGET_ENV" 2>&1 | tee deploy.log

      - name: Write production deployment summary
        if: always()
        shell: bash
        run: |
          DEPLOYMENT_ID=$(grep -Eo '(Current )?Version ID: [^[:space:]]+' deploy.log 2>/dev/null | tail -1 | sed -E 's/.*ID: //' || true)
          DEPLOYMENT_URL=$(grep -Eo 'https://[^[:space:]]+' deploy.log 2>/dev/null | tail -1 | sed 's/[),.]$//' || true)
          {
            echo "## Cool Masala production deployment"
            echo "- Environment: **production**"
            echo "- Worker: **$WORKER_NAME**"
            echo "- Deployment ID: \\`${DEPLOYMENT_ID:-not emitted by Wrangler}\`"
            echo "- Deployment URL: ${DEPLOYMENT_URL:-not emitted by Wrangler output}"
            echo "- Source: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
